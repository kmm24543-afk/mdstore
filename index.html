<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MD STORE</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--ink:#0b0b0d;--ink2:#1c1d21;--paper:#ececee;--text:#17171b;--mut:#6d6d76;--wa:#19b95c;--red:#d93a2b}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#fff;font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.5}
.wrap{max-width:1200px;margin:0 auto;padding:0 14px}
a{color:inherit;text-decoration:none}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 0 12px}
.nav a{margin-inline-end:28px;font-size:17px;opacity:.9;padding-bottom:3px}
.nav a.on{border-bottom:2px solid #fff}
.ic{display:flex;gap:14px;justify-content:flex-end;font-size:26px}
.ic span{cursor:pointer}
.logo{text-align:center;direction:ltr;line-height:1}
.logo b{font-size:52px;font-weight:900;letter-spacing:-3px;font-style:italic}
.logo i{display:block;font-style:normal;font-size:14px;letter-spacing:8px;font-weight:700;margin-top:2px}
.hero{display:grid;grid-template-columns:1fr 1.1fr 1fr;align-items:center;min-height:380px;background:#111 center/cover;position:relative;overflow:hidden}
.hero .img{height:100%;min-height:380px;background:center/cover;-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);mask-image:linear-gradient(270deg,#000 60%,transparent)}
.hero .mid{text-align:center;padding:10px;direction:ltr}
.hero .mid .big{font-size:120px;font-weight:900;font-style:italic;letter-spacing:-8px;line-height:.95;text-shadow:0 2px 12px #000}
.hero .mid .st{letter-spacing:16px;font-size:30px;font-weight:800;margin-top:2px}
.hero .mid small{display:block;letter-spacing:4px;font-size:13px;margin-top:10px}
.hero .mid h2{font-size:28px;margin:12px 0 8px;direction:rtl}
.pill{display:inline-block;background:#fff;color:#000;border-radius:99px;padding:9px 34px;font-size:17px;font-weight:700;direction:rtl}
.hero .txt{text-align:center;padding:10px 14px}
.brush{background:#34353a;padding:10px 20px;clip-path:polygon(0 12%,6% 0,30% 8%,60% 0,100% 6%,96% 50%,100% 92%,70% 100%,35% 94%,5% 100%,2% 55%);font-size:28px;font-weight:800;line-height:1.35;display:inline-block}
.feat{display:flex;gap:16px;justify-content:center;margin-top:18px;font-size:15px;color:#ddd}
.feat div span{display:block;font-size:32px}
.panel{background:var(--paper);color:var(--text);padding:24px 22px 28px}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:22px}
.cats button{background:var(--ink2);color:#fff;border:2px solid transparent;border-radius:4px;padding:22px 4px 16px;font:inherit;font-size:17px;font-weight:700;cursor:pointer}
.cats button.on{border-color:var(--wa)}
.cats span{display:block;font-size:40px;filter:grayscale(1) brightness(2.2);margin-bottom:4px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh h3{margin:0;font-size:24px;border-bottom:2px solid var(--text);padding-bottom:1px}
.sh a{font-size:15px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.card{display:flex;flex-direction:column;gap:3px;text-align:center}
.pic{aspect-ratio:1/1;background:#dcdce0;display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:4px;inset-inline-end:4px;background:#222;color:#fff;font-size:13px;padding:1px 9px;border-radius:3px}
.card h4{margin:4px 0 0;font-size:16px;font-weight:600;color:#444}
.price{font-size:19px;font-weight:700}
.old{color:var(--mut);text-decoration:line-through;font-weight:400;margin-inline-start:5px}
.wa{background:var(--wa);color:#fff;border-radius:5px;padding:10px 4px;font-size:14px;font-weight:700;margin-top:2px;display:block}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px}
footer{padding:18px 0 90px}
.f1{display:grid;grid-template-columns:1.1fr 1.4fr 1fr;gap:14px;align-items:center;text-align:center}
.f1 .nums .wa{border-radius:99px;font-size:17px;padding:11px;margin:8px auto 0;max-width:280px;direction:ltr}
.f1 .nums p{margin:0;font-size:16px}
.ft{display:flex;justify-content:space-around;font-size:15px;color:#cfcfd4}
.ft span{display:block;font-size:36px}
.script{font-family:"Segoe Script","Brush Script MT",cursive;font-size:34px;direction:ltr;transform:rotate(-6deg)}
.f2{border-top:1px solid #333;margin-top:16px;padding-top:12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-size:14px;color:#bbb;gap:8px}
.f2 .lk a{margin-inline-end:12px}
.soc{display:flex;gap:6px;margin-bottom:5px}
.soc span{width:32px;height:32px;border:1px solid #888;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.bar{position:fixed;inset-inline:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#1c1d21;border-top:1px solid #333;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;z-index:5}
button.b{font:inherit;cursor:pointer;border:1px solid #444;background:#2a2b30;color:#fff;padding:8px 16px;border-radius:10px}
button.pri{background:var(--wa);border-color:var(--wa);font-weight:700}
.msg{font-size:13px;color:#aaa;align-self:center}
.ed{display:flex;flex-direction:column;gap:3px;text-align:start}
.ed label{font-size:10px;color:var(--mut)}
.ed input,.ed select{width:100%;font:inherit;font-size:12px;padding:4px 6px;border:1px solid #bbb;border-radius:5px;background:#fff;color:#000}
.set{background:#1c1d21;border:1px dashed var(--wa);padding:12px;margin:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.set label{color:#aaa}
.del{color:var(--red);background:none;border:1px solid var(--red);border-radius:5px;font:inherit;font-size:12px;padding:3px;cursor:pointer}
@media(max-width:700px){.hero .mid .big{font-size:80px;letter-spacing:-6px}.logo b{font-size:40px}.panel{padding:16px 12px}.grid{gap:12px;grid-template-columns:repeat(2,1fr)}.cats{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}.hero .img{min-height:220px;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}.f1,.f2{grid-template-columns:1fr}header{grid-template-columns:1fr 1fr;row-gap:8px}header .logo{order:-1;grid-column:1/-1}.nav a{font-size:14px;margin-inline-end:12px}.cats button{font-size:14px}.card h4{font-size:15px}.hero .mid h2{font-size:22px}.brush{font-size:22px}}
</style>
</head>

function render(){
  var w=state.store.split(' '),h='<div class="wrap"><header><div class="nav"><a class="on" href="#">الرئيسية</a><a href="#products">المنتجات</a><a href="#contact">من نحن</a><a href="#contact">تواصل معنا</a></div><div class="logo"><b>'+esc(w[0])+'</b><i>'+esc(w.slice(1).join(' '))+'</i></div><div class="ic"><span data-search="1" title="بحث">🔍</span><a href="https://wa.me/'+num(state.phone)+'" target="_blank" rel="noopener">🛒</a></div></header>';
  h+='<section class="hero"><div class="txt"><div class="brush">'+esc(state.title)+'</div><div class="feat"><div><span>⭐</span>أفضل الأسعار</div><div><span>🚚</span>توصيل سريع</div><div><span>🛡️</span>جودة عالية</div></div></div><div class="mid"><div class="big">'+esc(w[0])+'</div><div class="st">'+esc(w.slice(1).join(' '))+'</div><small>'+esc(state.tag)+'</small><h2>'+esc(state.slogan)+'</h2><a class="pill" href="#products">‹ تسوق الآن</a></div><div class="img" style="background-image:url('+esc(state.hero)+')"></div></section>';
  if(editing)h+='<div class="set">'+setf('اسم المتجر','store')+setf('الشعار الصغير','tag')+setf('العنوان الرئيسي','title')+setf('الجملة التسويقية','slogan')+setf('واتساب 1 (بالكود الدولي 201...)','phone')+setf('واتساب 2','phone2')+setf('العملة','cur')+'<div class="ed"><label>صورة الغلاف</label><input type="file" accept="image/*" data-hero="1"></div></div>';
  h+='<div class="panel" id="products"><div class="cats">'+CATS.map(function(c){return '<button data-f="'+c[0]+'" class="'+(filter===c[0]&&!editing?'on':'')+'"><span>'+c[1]+'</span>'+c[0]+'</button>'}).join('')+'</div><div class="sh"><h3>أحدث المنتجات</h3><a data-f="الكل">‹ عرض الكل</a></div><div class="grid">';
  var list=state.products.map(function(p,i){return show(p)?(editing?editCard(p,i):card(p)):''}).join('');
  h+=(list||'<div class="empty">لا توجد منتجات</div>')+'</div></div>';
  var n2=num(state.phone2);
  h+='<footer id="contact"><div class="f1"><div class="nums"><p>للطلب والاستفسار<br>تواصل معنا على واتساب</p><a class="wa" href="https://wa.me/'+num(state.phone)+'" target="_blank" rel="noopener">'+WAI+'+'+num(state.phone)+'</a>'+(n2?'<a class="wa" href="https://wa.me/'+n2+'" target="_blank" rel="noopener">'+WAI+'+'+n2+'</a>':'')+'</div><div class="ft"><div><span>🎧</span>خدمة عملاء متميزة</div><div><span>🚚</span>توصيل سريع</div><div><span>🛡️</span>جودة مضمونة</div></div><div><div class="script">'+esc(state.store)+'</div><div style="font-size:17px;margin-top:4px">اختيارك الأفضل دائمًا</div></div></div>';
  h+='<div class="f2"><div class="lk"><a href="#">الرئيسية</a><a href="#products">المنتجات</a><a href="#contact">من نحن</a><a href="#contact">تواصل معنا</a></div><div class="logo"><b style="font-size:36px">'+esc(w[0])+'</b></div><div><div class="soc"><span>♪</span><span>ig</span><span>f</span><span>▶</span></div>© 2025 '+esc(state.store)+' - جميع الحقوق محفوظة</div></div></footer></div>';
  if(canEdit)h+='<div class="bar">'+(editing?'<button class="b" id="add">+ منتج جديد</button><button class="b pri" id="save">حفظ وتحميل الملف</button><button class="b" id="cancel">إلغاء</button>':'<button class="b pri" id="edit">تعديل الموقع</button>')+'<span class="msg">'+esc(status)+'</span></div>';
  app.innerHTML=h;
}
function shrink(file,max,cb){
  var r=new FileReader();
  r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.78))};im.src=r.result};
  r.readAsDataURL(file);
}
app.addEventListener('input',function(e){var t=e.target;if(t.dataset.s)state[t.dataset.s]=t.value;else if(t.dataset.k)state.products[+t.dataset.i][t.dataset.k]=t.value});
app.addEventListener('change',function(e){var t=e.target,f=t.files&&t.files[0];
  if(t.dataset.k&&t.tagName==='SELECT')state.products[+t.dataset.i][t.dataset.k]=t.value;
  if(f&&t.dataset.img!==undefined)shrink(f,700,function(d){state.products[+t.dataset.img].img=d;render()});
  if(f&&t.dataset.hero)shrink(f,1400,function(d){state.hero=d;render()});
});
app.addEventListener('click',function(e){
  if(e.target.closest('[data-search]')){var v=prompt('ابحث عن منتج');if(v!==null){q=v.trim();render()}return}
  var f=e.target.closest('[data-f]');if(f&&!editing){filter=f.dataset.f;q='';render();return}
  var t=e.target.closest('button');if(!t)return;
  if(t.id==='edit'){backup=JSON.stringify(state);editing=true;status='';render()}
  else if(t.id==='cancel'){state=JSON.parse(backup);editing=false;render()}
  else if(t.id==='add'){state.products.unshift({id:'p'+Date.now(),name:'منتج جديد',price:0,old:'',badge:'جديد',cat:'تيشيرتات',img:'',emoji:'🛍️'});render()}
  else if(t.dataset.del!==undefined){if(confirm('حذف المنتج؟')){state.products.splice(+t.dataset.del,1);render()}}
  else if(t.id==='save')save();
});
function save(){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
  c.querySelector('#app').innerHTML='';
  var blob=new Blob(['<!doctype html>\n'+c.outerHTML],{type:'text/html'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';
  document.body.appendChild(a);a.click();a.remove();
  editing=false;status='اتحمّل الملف index.html – ارفعه على الاستضافة مكان القديم';render();
}
canEdit=location.hash==='#admin';
render();
})();
</script>
</body>
